apiVersion: 1.0.0
info:
  gatewayMinVersion: 2.0.0
  type: oss
  category: ai
  name: model-mapper
  image: platform_wasm/model-mapper
  title: Exact Model Mapper
  version: 1.0.1
  description: Maps an exact public model and captures immutable original request bytes before rewriting.
spec:
  phase: default
  priority: 200
  configSchema:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      not:
        required: [capture_body_basis, consume_body_basis]
        properties:
          capture_body_basis:
            const: true
          consume_body_basis:
            const: true
      required:
      - modelMapping
      properties:
        modelMapping:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            minLength: 1
        consume_body_basis:
          type: boolean
          default: false
          description: Preserve and validate the original basis from the explicitly configured first preprocessor. Mutually exclusive with capture_body_basis.
        capture_body_basis:
          type: boolean
          default: false
  routeConfigSchema:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      not:
        required: [capture_body_basis, consume_body_basis]
        properties:
          capture_body_basis:
            const: true
          consume_body_basis:
            const: true
      required:
      - modelMapping
      properties:
        modelMapping:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            minLength: 1
        consume_body_basis:
          type: boolean
          default: false
          description: Preserve and validate the original basis from the explicitly configured first preprocessor. Mutually exclusive with capture_body_basis.
        capture_body_basis:
          type: boolean
          default: false
