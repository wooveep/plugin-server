apiVersion: 1.0.0
info:
  gatewayMinVersion: ""
  type: oss
  category: ai
  image: platform_wasm/ai-quota
  name: ai-quota
  title: AI Monetary Quota
  x-title-i18n:
    zh-CN: AI 金额配额
  description: Perform read-only Redis balance admission for AI requests.
  x-description-i18n:
    zh-CN: 基于只读 Redis 热余额对 AI 请求进行准入检查。
  iconUrl: https://img.alicdn.com/imgextra/i1/O1CN018iKKih1iVx287RltL_!!6000000004419-2-tps-42-42.png
  readmeUrl: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-quota/README.md
  x-readmeUrl-i18n:
    en-US: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-quota/README_EN.md
  version: 2.0.0
  contact:
    name: 2456868764
spec:
  phase: default
  priority: 280
  configSchema:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      required: [redis, balance_scope_id, cache_generation, projection_schema]
      properties:
        redis:
          type: object
          additionalProperties: false
          title: Redis配置
          x-title-i18n:
            en-US: Redis Configuration
          description: 只读余额热数据的 Redis 连接配置
          x-description-i18n:
            en-US: Redis connection for read-only balance hot data
          required: [service_name]
          properties:
            service_name:
              type: string
              title: Redis服务名称
              x-title-i18n:
                en-US: Redis Service Name
              description: Redis 服务名称，例如 my-redis.dns 或 redis.my-ns.svc.cluster.local
              x-description-i18n:
                en-US: Redis service name, such as my-redis.dns or redis.my-ns.svc.cluster.local
            service_port:
              type: integer
              title: Redis服务端口
              x-title-i18n:
                en-US: Redis Service Port
              description: Redis 服务端口；static 服务默认为 80，其他默认为 6379
              x-description-i18n:
                en-US: Redis service port; defaults to 80 for static services and 6379 otherwise
              default: 6379
            username:
              type: string
              title: Redis用户名
              x-title-i18n:
                en-US: Redis Username
              description: Redis 用户名
              x-description-i18n:
                en-US: Redis username
            password:
              type: string
              title: Redis密码
              x-title-i18n:
                en-US: Redis Password
              description: Redis 密码
              x-description-i18n:
                en-US: Redis password
            timeout:
              type: integer
              title: Redis连接超时
              x-title-i18n:
                en-US: Redis Connection Timeout
              description: Redis 连接超时时间，单位毫秒
              x-description-i18n:
                en-US: Redis connection timeout in milliseconds
              default: 1000
            database:
              type: integer
              title: Redis数据库
              x-title-i18n:
                en-US: Redis Database
              description: Redis database 编号
              x-description-i18n:
                en-US: Redis database index
              default: 0
        balance_scope_id:
          type: string
          title: 余额作用域
          x-title-i18n: {en-US: Balance Scope}
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Console当前受控发布中的非空UUID，禁止由请求覆盖
        cache_generation:
          type: string
          title: 缓存代际
          x-title-i18n: {en-US: Cache Generation}
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Console当前受控发布中的非空UUID，禁止由请求覆盖
        projection_schema:
          type: string
          title: 余额协议
          enum: [balance.v1]
        missing_balance_policy:
          type: string
          title: 缺失余额处理
          enum: [deny]
          default: deny
        path_scope:
          type: string
          default: legacy_suffixes
          title: 受管新调用路径
          enum: [legacy_suffixes, bound_target]
          description: legacy_suffixes使用默认模型后缀；bound_target使用已绑定的新调用入口。已受理任务查询由路由或方法过滤排除，GET/HEAD新调用仍执行准入。
        enable_path_suffixes:
          type: array
          title: 路径后缀交集
          items: {type: string, pattern: '.*\S.*'}
        enable_methods:
          type: array
          title: 方法交集
          items: {type: string, pattern: '.*\S.*'}
      example:
        balance_scope_id: 00000000-0000-0000-0000-000000000005
        cache_generation: 00000000-0000-0000-0000-000000000006
        projection_schema: balance.v1
        missing_balance_policy: deny
        redis:
          service_name: redis-service.higress-system.svc.cluster.local
          service_port: 6379
          timeout: 1000
          database: 0
        path_scope: legacy_suffixes
        enable_path_suffixes: [/v1/chat/completions, /v1/messages]
  routeConfigSchema:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      properties:
        path_scope:
          type: string
          title: 受管新调用路径
          enum: [legacy_suffixes, bound_target]
          description: legacy_suffixes使用默认模型后缀；bound_target使用已绑定的新调用入口。已受理任务查询由路由或方法过滤排除，GET/HEAD新调用仍执行准入。
        enable_path_suffixes:
          type: array
          title: 路径后缀交集
          items: {type: string, pattern: '.*\S.*'}
        enable_methods:
          type: array
          title: 方法交集
          items: {type: string, pattern: '.*\S.*'}
      example:
        path_scope: bound_target
        enable_methods: [POST]
