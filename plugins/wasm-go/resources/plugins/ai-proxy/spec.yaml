apiVersion: 1.0.0
info:
  gatewayMinVersion: 2.0.0
  type: oss
  category: ai
  image: platform_wasm/ai-proxy
  name: ai-proxy
  title: AI Proxy
  x-title-i18n:
    zh-CN: AI 代理
  description: Provide a unified OpenAI-compatible AI gateway that can proxy OpenAI,
    Claude, Responses API, embeddings, image generation, and provider-native traffic
    to multiple AI service providers.
  x-description-i18n:
    zh-CN: 提供统一的 OpenAI 兼容 AI 网关能力，可代理 OpenAI、Claude、Responses API、Embedding、图片生成以及厂商原生请求到多个
      AI 服务提供商。
  iconUrl: https://img.alicdn.com/imgextra/i1/O1CN018iKKih1iVx287RltL_!!6000000004419-2-tps-42-42.png
  readmeUrl: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-proxy/README.md
  x-readmeUrl-i18n:
    en-US: https://github.com/alibaba/higress/blob/main/plugins/wasm-go/extensions/ai-proxy/README_EN.md
  version: 2.0.13
  contact:
    name: CH3CHO
    url: https://github.com/CH3CHO
    email: ch3cho@qq.com
spec:
  phase: default
  priority: 100
  x-modelfusion-ai-routing:
    minimumPluginVersion: 1.0.2
    protocolModes:
    - auto
    - passthrough
    pathScopes:
    - legacy_suffixes
    - bound_target
    adapters:
    - id: qwen.responses_to_chat_completions
      provider: qwen
      capability: openai/v1/responses
      operations:
      - id: openai.responses_to_chat_completions
        clientMethod: POST
        clientPath: /v1/responses
        upstreamMethod: POST
        upstreamPath: /v1/chat/completions
        requestTransform: responses_to_chat_completions
        responseTransform: chat_completions_to_responses
        streamingBehavior: compatible
      usageProfile: openai.responses.v1
      minimumPluginVersion: 1.0.2
    - id: responses.to_chat_completions
      provider: '*'
      capability: openai/v1/responses
      operations:
      - id: openai.responses_to_chat_completions
        clientMethod: POST
        clientPath: /v1/responses
        upstreamMethod: POST
        upstreamPath: /v1/chat/completions
        requestTransform: responses_to_chat_completions
        responseTransform: chat_completions_to_responses
        streamingBehavior: compatible
      usageProfile: openai.responses.v1
      minimumPluginVersion: 1.0.2
  configSchema:
    x-higress-external-resources:
    - kind: redis
      registryType: dns
      domainPath: managed_execution.redis.service_name
      portPath: managed_execution.redis.service_port
      projectedNamePath: managed_execution.redis.service_name
    - kind: redis
      registryType: dns
      domainPath: managed_media.redis.service_name
      portPath: managed_media.redis.service_port
      projectedNamePath: managed_media.redis.service_name
    openAPIV3Schema:
      type: object
      allOf:
      - if:
          required:
          - managed_execution
          - _modelfusion_execution
          properties:
            managed_execution:
              required:
              - text_execution
        then:
          required:
          - _modelfusion_execution_targets
      - if:
          required:
          - _modelfusion_execution
          properties:
            _modelfusion_execution:
              required:
              - schema_version
              properties:
                schema_version:
                  const: modelfusion-execution.v1
        then:
          required:
          - managed_execution
          properties:
            managed_execution:
              required:
              - credential_value
              not:
                anyOf:
                - required:
                  - credentials
              properties:
                upstream_health:
                  required:
                  - target
                  not:
                    anyOf:
                    - required:
                      - targets
      - if:
          required:
          - _modelfusion_execution
          properties:
            _modelfusion_execution:
              required:
              - schema_version
              properties:
                schema_version:
                  const: modelfusion-execution.v2
        then:
          required:
          - managed_execution
          properties:
            managed_execution:
              required:
              - credentials
              - upstream_health
              not:
                anyOf:
                - required:
                  - credential_value
              properties:
                upstream_health:
                  required:
                  - targets
                  not:
                    anyOf:
                    - required:
                      - target
      - if:
          required:
          - _modelfusion_execution
          properties:
            _modelfusion_execution:
              required:
              - descriptor
              properties:
                descriptor:
                  required:
                  - capabilities
                  properties:
                    capabilities:
                      required:
                      - text_embedding
        then:
          required:
          - managed_execution
          properties:
            managed_execution:
              required:
              - call_identity_source
              - input_protocol
              - upstream_protocol
              - upstream_health
              properties:
                call_identity_source:
                  const: internal_execution
                input_protocol:
                  const: openai_embeddings
                upstream_protocol:
                  const: openai_embeddings
                media_dispatch_mode:
                  not:
                    const: managed_operation
              not:
                required:
                - text_execution
      - if:
          required:
          - managed_execution
          properties:
            managed_execution:
              anyOf:
              - required:
                - input_protocol
                properties:
                  input_protocol:
                    const: openai_embeddings
              - required:
                - upstream_protocol
                properties:
                  upstream_protocol:
                    const: openai_embeddings
        then:
          properties:
            _modelfusion_execution:
              properties:
                descriptor:
                  properties:
                    capabilities:
                      required:
                      - text_embedding
      properties:
        managed_media:
          type: object
          additionalProperties: false
          required:
          - producer_id
          - service_auth_token
          - private_stream
          - redis
          - profiles
          - queue_capacity
          - max_response_bytes
          properties:
            producer_id:
              type: string
              minLength: 1
              maxLength: 256
            service_auth_token:
              type: string
              minLength: 1
              maxLength: 8192
              writeOnly: true
            private_stream:
              type: string
              minLength: 1
              maxLength: 256
            redis:
              type: object
              additionalProperties: false
              required:
              - service_name
              properties:
                service_name:
                  type: string
                  minLength: 1
                service_port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                username:
                  type: string
                password:
                  type: string
                  writeOnly: true
                database:
                  type: integer
                  minimum: 0
                timeout:
                  type: integer
                  minimum: 1
            profiles:
              type: array
              minItems: 1
              maxItems: 64
              items:
                type: object
                additionalProperties: false
                required:
                - profile
                - adapter_ref
                - adapter_revision
                - create_classifier_ref
                - output_identity_contract
                properties:
                  profile:
                    type: string
                    enum:
                    - qwen_image20_pro_sync
                    - qwen_image30_native_sync
                    - qwen_image30_compatible_sync
                    - qwen_image30_native_async
                    - wan30_text
                    - wan30_first_frame
                  adapter_ref:
                    type: string
                    minLength: 1
                    maxLength: 256
                  adapter_revision:
                    type: string
                    minLength: 1
                    maxLength: 256
                  create_classifier_ref:
                    type: string
                    minLength: 1
                    maxLength: 256
                  query_classifier_ref:
                    type: string
                    minLength: 1
                    maxLength: 256
                  query_capability_ref:
                    type: string
                    minLength: 1
                    maxLength: 256
                  output_identity_contract:
                    type: string
                    minLength: 1
                    maxLength: 256
            queue_capacity:
              type: integer
              minimum: 1
              maximum: 256
            max_response_bytes:
              type: integer
              minimum: 1024
              maximum: 4194304
        managed_execution: &id003
          type: object
          additionalProperties: false
          required:
          - producer_id
          - call_identity_source
          - private_stream
          - redis
          - upstream_path
          - authority
          properties:
            text_execution:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                retry:
                  type: object
                  additionalProperties: false
                  required:
                  - max_retries
                  - retry_timeout_ms
                  - retry_on_status
                  properties:
                    max_retries:
                      type: integer
                      minimum: 1
                      maximum: 4294967294
                    retry_timeout_ms:
                      type: integer
                      minimum: 1
                      maximum: 600000
                    retry_on_status:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                        maxLength: 200
                fallback:
                  type: object
                  additionalProperties: false
                  required:
                  - strategy
                  - targets
                  - response_codes
                  properties:
                    strategy:
                      type: string
                      enum:
                      - sequence
                      - random
                    targets:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - target_id
                        - weight
                        properties:
                          target_id:
                            type: string
                            minLength: 1
                            maxLength: 200
                          weight:
                            type: integer
                            const: 1
                    response_codes:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                        maxLength: 200
            usage_estimation:
              type: object
              additionalProperties: false
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - disabled
                  - wan_total_minus_input_v1
            call_identity_source:
              type: string
              enum:
              - admission
              - internal_execution
            internal_authority:
              type: object
              additionalProperties: false
              required:
              - service_name
              - service_port
              - host
              - auth_token
              - timeout_ms
              properties:
                service_name:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: '^[^ /:@?#\[\]\x00-\x20]+$'
                service_port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                host:
                  type: string
                  minLength: 1
                  maxLength: 256
                auth_token:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  pattern: '^[!-~]+$'
                  writeOnly: true
                timeout_ms:
                  type: integer
                  minimum: 1
                  maximum: 5000
            input_protocol:
              type: string
              enum:
              - openai_chat
              - openai_responses
              - anthropic_messages
              - qwen_image20_pro_sync
              - qwen_image30_native_sync
              - qwen_image30_compatible_sync
              - qwen_image30_native_async
              - wan30_text
              - wan30_first_frame
              - openai_embeddings
            upstream_protocol:
              type: string
              enum:
              - openai_chat
              - openai_responses
              - anthropic_messages
              - qwen_image20_pro_sync
              - qwen_image30_native_sync
              - qwen_image30_compatible_sync
              - qwen_image30_native_async
              - wan30_text
              - wan30_first_frame
              - openai_embeddings
            media_dispatch_mode:
              type: string
              enum:
              - disabled
              - managed_operation
            upstream_health:
              type: object
              additionalProperties: false
              required:
              - runtime_config_id
              - config_revision
              - snapshot
              properties:
                runtime_config_id:
                  type: string
                  minLength: 1
                  maxLength: 256
                config_revision:
                  type: string
                  pattern: ^[1-9][0-9]*$
                snapshot:
                  type: object
                  additionalProperties: false
                  required:
                  - prefix
                  - authority_id
                  - minimum_revision
                  properties:
                    prefix:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9_:-]+$
                    authority_id:
                      type: string
                      minLength: 1
                      maxLength: 256
                    minimum_revision:
                      type: string
                      pattern: ^(0|[1-9][0-9]*)$
                target:
                  type: object
                  additionalProperties: false
                  required:
                  - target_id
                  - binding_id
                  - provider_account_id
                  - region_endpoint_ref
                  - upstream_model
                  - operation_kind
                  - credential_ref
                  - credential_generation
                  - scope_ids
                  properties:
                    target_id:
                      type: string
                      minLength: 1
                      maxLength: 256
                    binding_id:
                      type: string
                      minLength: 1
                      maxLength: 256
                    provider_account_id:
                      type: string
                      minLength: 1
                      maxLength: 256
                    region_endpoint_ref:
                      type: string
                      minLength: 1
                      maxLength: 256
                    upstream_model:
                      type: string
                      minLength: 1
                      maxLength: 256
                    operation_kind:
                      type: string
                      enum:
                      - text_generate
                      - image_generate
                      - video_generate
                      - task_query
                      - text_embedding
                    credential_ref:
                      type: string
                      minLength: 1
                      maxLength: 256
                    credential_generation:
                      type: string
                      pattern: ^[1-9][0-9]*$
                    scope_ids:
                      type: array
                      minItems: 1
                      maxItems: 64
                      uniqueItems: true
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                targets:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - target_id
                    - binding_id
                    - provider_account_id
                    - region_endpoint_ref
                    - upstream_model
                    - operation_kind
                    - credential_ref
                    - credential_generation
                    - scope_ids
                    properties:
                      target_id:
                        type: string
                        minLength: 1
                        maxLength: 256
                      binding_id:
                        type: string
                        minLength: 1
                        maxLength: 256
                      provider_account_id:
                        type: string
                        minLength: 1
                        maxLength: 256
                      region_endpoint_ref:
                        type: string
                        minLength: 1
                        maxLength: 256
                      upstream_model:
                        type: string
                        minLength: 1
                        maxLength: 256
                      operation_kind:
                        type: string
                        enum:
                        - text_generate
                        - image_generate
                        - video_generate
                        - task_query
                        - text_embedding
                      credential_ref:
                        type: string
                        minLength: 1
                        maxLength: 256
                      credential_generation:
                        type: string
                        pattern: ^[1-9][0-9]*$
                      scope_ids:
                        type: array
                        minItems: 1
                        maxItems: 128
                        uniqueItems: true
                        items:
                          type: string
                          minLength: 1
                          maxLength: 256
                  description: Complete original TargetReference for every declared
                    operation and credential; native runtime verifies the exact bijection.
              oneOf:
              - required:
                - target
                not:
                  anyOf:
                  - required:
                    - targets
              - required:
                - targets
                not:
                  anyOf:
                  - required:
                    - target
            producer_id:
              type: string
              minLength: 1
            private_stream:
              type: string
              minLength: 1
            redis:
              type: object
              additionalProperties: false
              required:
              - service_name
              properties:
                service_name:
                  type: string
                  minLength: 1
                service_port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                username:
                  type: string
                password:
                  type: string
                  writeOnly: true
                database:
                  type: integer
                  minimum: 0
                timeout:
                  type: integer
                  minimum: 1
            upstream_path:
              type: string
              minLength: 1
            authority:
              type: string
              minLength: 1
            credential_value:
              type: string
              minLength: 1
              writeOnly: true
            timeout_ms:
              type: integer
              minimum: 1
              maximum: 4294967295
            credentials:
              type: array
              minItems: 1
              uniqueItems: true
              description: Exact frozen secret directory, joined by credential reference
                and revision; array position never selects a key.
              items:
                type: object
                additionalProperties: false
                required:
                - credential_ref
                - credential_revision
                - credential_value
                properties:
                  credential_ref:
                    type: string
                    minLength: 1
                    maxLength: 256
                  credential_revision:
                    type: string
                    pattern: ^[1-9][0-9]*$
                    maxLength: 39
                  credential_value:
                    type: string
                    minLength: 1
                    maxLength: 8192
                    pattern: ^[!-~]+$
                    not:
                      pattern: '[^!-~]'
                    writeOnly: true
          allOf:
          - if:
              required:
              - call_identity_source
              properties:
                call_identity_source:
                  const: internal_execution
            then:
              required:
              - upstream_health
              - internal_authority
              properties:
                media_dispatch_mode:
                  not:
                    const: managed_operation
            else:
              not:
                required:
                - internal_authority
          - if:
              anyOf:
              - required:
                - input_protocol
                properties:
                  input_protocol:
                    const: openai_embeddings
              - required:
                - upstream_protocol
                properties:
                  upstream_protocol:
                    const: openai_embeddings
            then:
              required:
              - call_identity_source
              - input_protocol
              - upstream_protocol
              - upstream_health
              properties:
                call_identity_source:
                  const: internal_execution
                input_protocol:
                  const: openai_embeddings
                upstream_protocol:
                  const: openai_embeddings
                media_dispatch_mode:
                  not:
                    const: managed_operation
              not:
                required:
                - text_execution
          oneOf:
          - required:
            - credential_value
            not:
              anyOf:
              - required:
                - credentials
            properties:
              upstream_health:
                required:
                - target
                not:
                  anyOf:
                  - required:
                    - targets
          - required:
            - credentials
            - upstream_health
            not:
              anyOf:
              - required:
                - credential_value
            properties:
              upstream_health:
                required:
                - targets
                not:
                  anyOf:
                  - required:
                    - target
        _modelfusion_execution: &id002
          type: object
          readOnly: true
          additionalProperties: false
          required:
          - schema_version
          - descriptor
          - route_id
          - sales_asset_id
          - public_model
          properties:
            schema_version:
              type: string
              enum:
              - modelfusion-execution.v1
              - modelfusion-execution.v2
            descriptor:
              oneOf:
              - type: object
                properties:
                  release_id:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  target_id:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  binding_id:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  provider_id:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  provider_account_id:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  region_endpoint_ref:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  service_ref:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  cluster_ref:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  credential_pool_ref:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  adapter_ref:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                  credential_pool_revision:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Revision
                  adapter_revision:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Revision
                  mapper_digest:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Digest
                  proxy_digest:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Digest
                  descriptor_digest:
                    $ref: urn:modelfusion:contracts:v1:common#/$defs/Digest
                  upstream_model:
                    type: string
                    minLength: 1
                  config_canonicalization:
                    type: string
                    minLength: 1
                  transport_contract:
                    type: object
                    properties:
                      host:
                        type: string
                        minLength: 1
                      sni:
                        type: string
                      path_adapter_ref:
                        $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                    required:
                    - host
                    - sni
                    - path_adapter_ref
                    additionalProperties: false
                  capabilities:
                    type: object
                    minProperties: 1
                    properties:
                      text_generate:
                        type: object
                        properties:
                          send_mode:
                            enum:
                            - single_send
                            - observable_retry
                          response_classifier_ref:
                            $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                          query_capability_ref:
                            $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                          provider_idempotency_ref:
                            $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                          max_attempts:
                            type: integer
                            minimum: 1
                            maximum: 4294967295
                          max_fallback_hops:
                            type: integer
                            minimum: 0
                            maximum: 4294967295
                        required:
                        - send_mode
                        - response_classifier_ref
                        - max_attempts
                        - max_fallback_hops
                        additionalProperties: false
                      image_generate:
                        allOf:
                        - type: object
                          properties:
                            send_mode:
                              enum:
                              - single_send
                              - observable_retry
                            response_classifier_ref:
                              $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                            query_capability_ref:
                              $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                            provider_idempotency_ref:
                              $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                            max_attempts:
                              type: integer
                              minimum: 1
                              maximum: 4294967295
                            max_fallback_hops:
                              type: integer
                              minimum: 0
                              maximum: 4294967295
                          required:
                          - send_mode
                          - response_classifier_ref
                          - max_attempts
                          - max_fallback_hops
                          additionalProperties: false
                        - properties:
                            send_mode:
                              const: single_send
                            max_attempts:
                              const: 1
                            max_fallback_hops:
                              const: 0
                      video_generate:
                        allOf:
                        - type: object
                          properties:
                            send_mode:
                              enum:
                              - single_send
                              - observable_retry
                            response_classifier_ref:
                              $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                            query_capability_ref:
                              $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                            provider_idempotency_ref:
                              $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                            max_attempts:
                              type: integer
                              minimum: 1
                              maximum: 4294967295
                            max_fallback_hops:
                              type: integer
                              minimum: 0
                              maximum: 4294967295
                          required:
                          - send_mode
                          - response_classifier_ref
                          - max_attempts
                          - max_fallback_hops
                          additionalProperties: false
                        - properties:
                            send_mode:
                              const: single_send
                            max_attempts:
                              const: 1
                            max_fallback_hops:
                              const: 0
                      task_query:
                        type: object
                        properties:
                          send_mode:
                            enum:
                            - single_send
                            - observable_retry
                          response_classifier_ref:
                            $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                          query_capability_ref:
                            $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                          provider_idempotency_ref:
                            $ref: urn:modelfusion:contracts:v1:common#/$defs/Id
                          max_attempts:
                            type: integer
                            minimum: 1
                            maximum: 4294967295
                          max_fallback_hops:
                            type: integer
                            minimum: 0
                            maximum: 4294967295
                        required:
                        - send_mode
                        - response_classifier_ref
                        - max_attempts
                        - max_fallback_hops
                        additionalProperties: false
                    additionalProperties: false
                required:
                - release_id
                - target_id
                - binding_id
                - provider_id
                - provider_account_id
                - region_endpoint_ref
                - service_ref
                - cluster_ref
                - credential_pool_ref
                - adapter_ref
                - credential_pool_revision
                - adapter_revision
                - mapper_digest
