apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-quota
  namespace: higress-system
spec:
  # Example scope/generation only. Use the Console's observed current values.
  defaultConfig:
    balance_scope_id: 00000000-0000-0000-0000-000000000005
    cache_generation: 00000000-0000-0000-0000-000000000006
    projection_schema: balance.v1
    missing_balance_policy: deny
    redis:
      service_name: redis-service.higress-system.svc.cluster.local
      service_port: 6379
      timeout: 1000
    path_scope: legacy_suffixes
  defaultConfigDisable: true
  matchRules:
  # Console releases supply a complete rule config, including redis/balance
  # fields and execution_admission (managed-execution-admission.v1). Its full
  # schema is resources/plugins/ai-quota/spec.yaml. Do not hand-fill release,
  # access, revision, Console token, method or path selectors in this example.
  - ingress: [managed-model-invocation]
    configDisable: false
    config:
      path_scope: bound_target
  phase: UNSPECIFIED_PHASE
  priority: 280
  url: http://higress-plugin-server.higress-system.svc/plugins/ai-quota/2.0.5/plugin.wasm
